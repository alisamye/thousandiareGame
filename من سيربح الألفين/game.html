<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>من سيربح الالفين</title>
    <style>
        body{
            background-color: blue;
            margin: 0;
            font-family: 
            "Segoe UI", /* Excellent Arabic support on Windows */
            "Tahoma", /* Reliable fallback on older Windows */
            "Arial", /* Universal fallback */
            "Dubai", /* Modern Microsoft Arabic font */
            "Geeza Pro", /* Apple iOS / macOS standard Arabic font */
            "Apple SD Gothic Neo", 
            sans-serif;
            direction: rtl;
        }
        .window{
            display: grid;
            height: 100vh;
            grid-template-columns: 65% 35%;
            grid-template-rows: 15% 50% 35%;
        }
        .hints{
            grid-column: 1;
            grid-row: 1;
            display: flex;
            flex-direction: row;
            gap: 5px
        }
        #left{
            grid-column: 1;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            padding: 8px;
        }
        #audience-window{
            width: min(90%, 420px);
            padding: 12px;
            color: white;
            background-color: #17175c;
            border: 2px solid white;
            border-radius: 8px;
        }
        #audience-window h2{
            margin: 0 0 10px;
            font-size: 1.1rem;
        }
        .audience-row{
            display: grid;
            grid-template-columns: 75px minmax(0, 1fr) 42px;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }
        .audience-track{
            height: 18px;
            overflow: hidden;
            background-color: #555;
            border-radius: 9px;
        }
        .audience-bar{
            height: 100%;
            background-color: #42d66b;
            border-radius: inherit;
            transition: width 300ms ease;
        }
        #audience-window[hidden]{
            display: none;
        }
        .list{
            grid-column: 2;
            grid-row: 1/3;
            display: flex;
            flex-direction: column;
            direction: ltr;
        }
        .question-board{
            grid-column: 1/3;
            grid-row: 3;
            display: grid;
            grid-template-columns: auto auto;
            grid-template-rows: auto auto auto;
        }
        #yield{
            background-color: red;
            border: 3px solid black;
            border-radius: 50%;
            width: 10%
        }
        .available{
            background-color: green;
            border: 3px solid black;
            border-radius: 50%;
            width: 10%
        }
        .used{
            background-color: gray;
            border: 3px solid black;
            border-radius: 50%;
            width: 10%
        }
        .available:hover{
            background-color: orange;
        }
        .station{
            border: 3px solid black;
            border-radius: 5px;
            margin: 5px 3px;
            height: 7%;
        }
        .not-reached{
            background-color: purple;
        }
        .reached{
            background-color: yellow;
        }
        #question{
            background-color: purple;
            border: 3px solid black;
            border-radius: 5px;
            margin: 5px 3px;
            grid-row: 1;
            grid-column:1/3;
        }
        .answer1{
            border: 3px solid black;
            border-radius: 5px;
            margin: 5px 3px;
            grid-row: 2;
            grid-column:1;
        }
        .answer2{
            border: 3px solid black;
            border-radius: 5px;
            margin: 5px 3px;
            grid-row: 2;
            grid-column:2;
        }
        .answer3{
            border: 3px solid black;
            border-radius: 5px;
            margin: 5px 3px;
            grid-row: 3;
            grid-column:1;
        }
        .answer4{
            border: 3px solid black;
            border-radius: 5px;
            margin: 5px 3px;
            grid-row: 3;
            grid-column:2;
        }
        .not-selected{
            background-color: purple;
        }
        .not-selected:hover{
            background-color: orange;
        }
        .selected{
            background-color: orange;
        }
        .correct{
            background-color: green;
        }
        .wrong{
            background-color: red;
        }
        #continue{
            background-color: brown;
            border: 3px solid black;
            border-radius: 5px;
            margin: 5px;
            width: 10%;
            height: 10%
        }
        .number{
            color: white;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="hints">
            <button id="yield">أنسحاب</button>
            <button class="available" id="50/50">50/50</button>
            <button class="available" id="x2">X2</button>
            <button class="available" id="change">تبديل</button>
            <button class="available" id="audience">جمهور</button>
        </div>
        <div id="left">
            <button id="continue">لعبة جديدة</button>
        </div>
        <div class="list">
            <div class="station not-reached" id="q12"><span class="number">12.</span>&nbsp; <span class="number">2000</span></div>
            <div class="station not-reached" id="q11"><span class="number">11.</span>&nbsp; 1000</div>
            <div class="station not-reached" id="q10"><span class="number">10.</span>&nbsp; 500</div>
            <div class="station not-reached" id="q9"><span class="number">9.</span>&nbsp; 300</div>
            <div class="station not-reached" id="q8"><span class="number">8.</span>&nbsp; <span class="number">200</span></div>
            <div class="station not-reached" id="q7"><span class="number">7.</span>&nbsp; 100</div>
            <div class="station not-reached" id="q6"><span class="number">6.</span>&nbsp; 50</div>
            <div class="station not-reached" id="q5"><span class="number">5.</span>&nbsp; 30</div>
            <div class="station not-reached" id="q4"><span class="number">4.</span>&nbsp; <span class="number">20</span></div>
            <div class="station not-reached" id="q3"><span class="number">3.</span>&nbsp; 10</div>
            <div class="station not-reached" id="q2"><span class="number">2.</span>&nbsp; 5</div>
            <div class="station not-reached" id="q1"><span class="number">1.</span>&nbsp; 1</div>
        </div>
        <div class="question-board">
            <div id="question"></div>
            <div class="answer1 not-selected"><span class="number">1:</span>&nbsp;<span id="text1"></span></div>
            <div class="answer2 not-selected"><span class="number">2:</span>&nbsp;<span id="text2"></span></div>
            <div class="answer3 not-selected"><span class="number">3:</span>&nbsp;<span id="text3"></span></div>
            <div class="answer4 not-selected"><span class="number">4:</span>&nbsp;<span id="text4"></span></div>
        </div>
    </div>
    <script>
        //game variables
        var game_state = "start"; // could also be choose and next
        var questions_easy = [
            {

            },

            },

            {

            },
            {

            },
            {

            },
            {

            {
               question:"كم عدد لأعداد الأولية من 1 إلى 30",

        var questions_hard = [
            {
               question:"كم تساوي الجيجا بايت",
               answers: ["1000 كيلو بايت","1024 كيلو بايت","1000 ميجا بايت","1024 ميجا بايت"],
               correct: 3
            },
            {
               question:"ما هو أسرع حيوان يمشي على أربعة أرجل",
               answers: ["الفهد","النمر","الأسد","الضبع"],
               correct: 0
            },
            {
               question:" ما هو أقرب كوكب للأرض عندما تكون الكواكب على خط واحد",
               answers: ["الزهرة","عطارد","المريخ","القمر"],
               correct: 0
            },
            {
               question:"في أي عام هجري تم فتح مكة",
               answers: ["9","11","10","8"],
               correct: 3
            },
            {
               question:"كم عدد محافظات مصر",
               answers: ["28","27","25","26"],
               correct: 1
            },
            {
               question:"ما هو الطائر الموجود على علم مصر الآن عام 2026",
               answers: ["العقاب","النسر","الصقر","الغراب"],
               correct: 0
            },
            {
               question:"أي من هذه المخلوقات ليس ساما",
               answers: ["العقرب","أفعى الكوبرا","الضفدع الذهبي","البرص"],
               correct: 3
            },
            {
               question:"في أي قارة تقع دولة بنما",
               answers: ["أمريكا الجنوبية","أمريكا الشمالية","أوروبا","آسيا"],
               correct: 1
            },
            {
               question:"كم عدد آيات سورة غافر",
               answers: ["80","78","85","76"],
               correct: 2
            },
            {
               question:"من هو الصحابي الملقب بترجمان القرآن و حبر الأمة",
               answers: ["عبد الله بن عباس -رضي الله عنه","عبد الله بن مسعود-رضي الله عنه","الزبير بن العوام-رضي الله عنه","عبد الرحمن بن عوف-رضي الله عنه"],
               correct: 0
            },
            {
               question:"من الشخصية التي نلعب بها في لعبةالشر المقيم القرية الجزء الثامن",
               answers: ["غريس أشكروفت","ليون كينيدي","كريس ريدفيلد","إيثان وينترز"],
               correct: 3
            },
            {
               question:"ما اللون الغالب لشخصية هوبمون في لعبة هوبمون",
               answers: ["أصفر","بني","أحمر","أزرق"],
               correct: 0
            },
            {
               question:"كم عدد أصابع قدمي الصقر",
               answers: ["6","8","10","12"],
               correct: 1
            },
            {
               question:"ماذا كان اسم الشخصية التي يؤديها أحمد السقا في فيلم أفريكانو",
               answers: ["عصام","تيمور","بدر","أحمد"],
               correct: 2
            },
            {
               question:"ما العدد الذري للمغنيسيوم",
               answers: ["12","11","14","21"],

            },
            {

               answers: ["كريس ووكر","دكتور تريجر","ويلون بارك","مايلز أبشور"],
               correct: 3
            },
            {
               question:"إذا كانت سرعة سيارة 72 كيلومتر/الساعة فكم تكون بوحدة متر/ثانية",
               answers: ["20","22","18","30"],
               correct: 0
            },
            {
               question:"ما مدة يوم فلكي على كوكب المريخ تقريبا بالساعات",
               answers: ["22","26","24.6","25"],
               correct: 2
            },
            {
               question:"من المنتخب الفائز بكأس العالم لسنة 2018",
               answers: ["فرنسا","إسبانيا","البرازيل","الأرجنتين"],
               correct: 0
            },
            {
                question:"أي الموجات الكهرومغناطيسية الاتية صاحبة أكبر متوسط طول موجي",
                answers:["الاشعة فوق البنفسجية","الضوء المرئي","الأشعة السينية","أشعة جاما"],
                correct: 1
            },
            {
                question:"أي المخلوقات الأتية صاحب أقوى عضة",
                answers:["النمر","التمساح","الضبع","الأسد"],
                correct: 1
            },
            {
                question:"أي من هذه الأعمال لم يشارك فيها الفنان فريد شوقي",
                answers:["البخيل و أنا","جعلوني مجرما","دعاء الكروان","إعدام ميت"],
                correct: 2
            },
            {
                question:"متى تم تأميم قناة السويس",
                answers:["1955","1960","1958","1956"],
                correct: 3
            },
            {
                question:"من القائد العربي المسلم الذي فتح الاندلس",
                answers:["قتيبة بن مسلم","طارق بن زياد","خالد بن الوليد","عمرو بن العاص"],
                correct: 1
            },
            {
                question:"أي كروت يوجي صاحب أعلى طاقة هجوم",
                answers:["فارس الظلام","التنين الاسود أحمر العينين","التنين الأبيض أزرق العينين","السياف القاطع"],
                correct: 2
            },
            {
                question:"أي الدول الآتية لا يمر بها خط الاستواء",
                answers:["كينيا","اندونيسيا","البرازيل","غينيا"],
                correct: 3
            },
            {
                question:"كم عدد الدول التي تطل على البحر الأحمر",
                answers:["8","9","10","7"],
                correct: 0
            },
            {
               question:"أي الأعداد الأتية عدد أولي",
               answers: ["91","401","174","231"],
               correct: 1
            }
        ];
        var prizes = [1,5,10,20,30,50,100,200,300,500,1000,2000];
        var current_question = -1;
        var questions = new Array(14);
        var answer = -1;
        var answer2 = -1;
        var x2used = false;
        var removed_answers = [-1,-1];
        var removed_answers_used = false;
        var yield_used = false;
        var change_used = false;
        // actions
        document.getElementById("yield").addEventListener("click",()=>{
            if (game_state !== "choose" || current_question < 0)
                return;
            yield_used = true;
        });
        document.getElementById("50/50").addEventListener("click",()=>{
            const button = event.currentTarget;
            if (button.classList.contains("used") || game_state !== "choose" || current_question < 0)
                return;
            button.classList.replace("available","used");
            removed_answers_used = true;
            // choose two random wrong answers
            const correct = questions[current_question].correct;
            const wrong = [0,1,2,3].filter(i=> i !== correct);
            for(let i = wrong.length - 1;i>0;i--){
                const j = Math.floor(Math.random() * (i+1));
                [wrong[i],wrong[j]]=[wrong[j],wrong[i]];
            }
            removed_answers = wrong.slice(0,2);
            // remove text from removed answer
            document.getElementById("text"+(removed_answers[0]+1)).textContent = "";
            document.getElementById("text"+(removed_answers[1]+1)).textContent = "";
        });
        document.getElementById("x2").addEventListener("click",(event)=>{
            const button = event.currentTarget;
            if (button.classList.contains("used") || game_state !== "choose" || current_question < 0)
                return;
            x2used = true;
            button.classList.replace("available","used");
        });
        document.getElementById("change").addEventListener("click",()=>{
            const button = event.currentTarget;
            if (button.classList.contains("used") || game_state !== "choose" || current_question < 0)
                return;
            change_used = true;
            button.classList.replace("available","used");
        });
        document.getElementById("audience").addEventListener("click",(event)=>{
            const button = event.currentTarget;
            if (button.classList.contains("used") || game_state !== "choose" || current_question < 0)
                return;
            button.classList.replace("available","used");
            const left = document.getElementById("left");
            var total = 100;
            var correct;
            if (current_question <= 3){
                correct = 80;
            } else if (current_question <= 7) {
                correct = 50;
            } else {
                correct = 35;
            }
            total -= correct;
            var percentages = [0,0,0,0];
            percentages[questions[current_question].correct] = correct;
            var indexs = [0,1,2,3].filter(i => i !== questions[current_question].correct);
            for (let i = 0; i <= 1; i++){
                percentages[indexs[i]] = Math.floor(Math.random() * total);
                total -= percentages[indexs[i]];
            }
            percentages[indexs[2]] = total;
            const audienceWindow = document.createElement("div");
            audienceWindow.id = "audience-window";
            audienceWindow.setAttribute("aria-label", "نتائج تصويت الجمهور");

            const heading = document.createElement("h2");
            heading.textContent = "تصويت الجمهور";
            audienceWindow.appendChild(heading);

            percentages.forEach((percentage, index) => {
                const row = document.createElement("div");
                row.className = "audience-row";

                const label = document.createElement("span");
                label.textContent = "الإجابة " + (index + 1);
                row.appendChild(label);

                const track = document.createElement("div");
                track.className = "audience-track";
                track.setAttribute("role", "progressbar");
                track.setAttribute("aria-label", label.textContent);
                track.setAttribute("aria-valuemin", "0");
                track.setAttribute("aria-valuemax", "100");
                track.setAttribute("aria-valuenow", percentage);

                const bar = document.createElement("div");
                bar.className = "audience-bar";
                bar.style.width = percentage + "%";
                track.appendChild(bar);
                row.appendChild(track);

                const value = document.createElement("span");
                value.textContent = percentage + "%";
                row.appendChild(value);
                audienceWindow.appendChild(row);
            });

            left.appendChild(audienceWindow);
        });
        document.getElementById("continue").addEventListener("click",()=>{
            if(game_state === "start"){
                // start new game by first reseting everything in game 
                reset();
                // prepare questions
                prepareQuestions();
                // change state 
                game_state = "next";
                // change text on continue button
                document.getElementById("continue").textContent = "السؤال التالي";
            } else if (game_state === "choose"){
                // compare answers
                if (answer === -1)
                    return;
                if (x2used && answer2 === -1)
                    return;
                var pass = false;
                if (answer === questions[current_question].correct){
                    pass = true;
                    document.getElementsByClassName("answer"+(answer+1))[0].classList.replace("selected","correct");
                } else {
                    document.getElementsByClassName("answer"+(answer+1))[0].classList.replace("selected","wrong");
                }
                answer = -1;
                if (x2used){
                    if (answer2 === questions[current_question].correct){
                        pass = true;
                        document.getElementsByClassName("answer"+(answer2+1))[0].classList.replace("selected","correct");
                    } else {
                        document.getElementsByClassName("answer"+(answer2+1))[0].classList.replace("selected","wrong");
                    }
                    x2used = false;
                    answer2 = -1;
                }
                // change state and change text on continue button
                if (!pass && (!change_used && !yield_used)){
                    game_state = "start";
                    document.getElementById("continue").textContent = "لعبة جديدة";
                    showResult("lose");
                } else {
                    if (current_question === 11 && (!change_used && !yield_used)){
                        game_state = "start";
                        document.getElementById("continue").textContent = "لعبة جديدة";
                        document.getElementById("q"+(current_question+1)).classList.replace("not-reached","reached");
                        showResult("win");
                    } else {
                        game_state = "next";
                        document.getElementById("continue").textContent = "السؤال التالي";
                    }
                }
                // always show correct answer
                document.getElementsByClassName("answer"+(questions[current_question].correct+1))[0].classList.replace("selected","correct");
                document.getElementsByClassName("answer"+(questions[current_question].correct+1))[0].classList.replace("not-selected","correct");
            } else {
                if (yield_used){
                    game_state = "start";
                    document.getElementById("continue").textContent = "لعبة جديدة";
                    showResult("yield");
                    return;
                }
                if (change_used){
                    if(current_question <= 3){
                        [questions[current_question],questions[12]] = [questions[12],questions[current_question]];
                    } else {
                        [questions[current_question],questions[13]] = [questions[13],questions[current_question]];
                    }
                } else {
                    // update station list and current question
                    if (current_question !== -1){
                        document.getElementById("q"+(current_question+1)).classList.replace("not-reached","reached");
                    }
                    current_question++;
                }
                // reset used hints
                removed_answers_used = false;
                change_used = false;
                // remove audience if exists
                const audienceWindow = document.getElementById("audience-window");
                if (audienceWindow){
                    audienceWindow.remove();
                }
                // print next question
                printQuestion();
                // change state 
                game_state = "choose";
                // change text on continue button
                document.getElementById("continue").textContent = "أظهر الإجابة";
            }
        });
        document.querySelectorAll(".not-selected").forEach((element,index)=>{
            element.addEventListener("click",()=>{
                if (game_state === "start" || game_state === "next")
                    return;
                if(removed_answers_used && (index === removed_answers[0] || index === removed_answers[1]))
                    return;
                if(answer === -1){
                    answer = index;
                    element.classList.replace("not-selected","selected");
                    return;
                }
                if(x2used && answer2 === -1){
                    if(index === answer)
                        return;
                    answer2 = index;
                    element.classList.replace("not-selected","selected");
                }
            });
        });
        // helper functions
        function reset(){
            // reset stations list
            document.querySelectorAll(".station").forEach(element => {
                element.classList.replace("reached", "not-reached");
            });
            // reset question board
            document.getElementById("question").textContent = "";
            for(let i=1; i<=4;i++){
                document.getElementsByClassName("answer"+i)[0].classList.replace("selected","not-selected");
                document.getElementsByClassName("answer"+i)[0].classList.replace("correct","not-selected");
                document.getElementsByClassName("answer"+i)[0].classList.replace("wrong","not-selected");
                document.getElementById("text"+i).textContent = "";
            }
            // reset hints
            document.getElementById("50/50").classList.replace("used","available");
            document.getElementById("x2").classList.replace("used","available");
            document.getElementById("change").classList.replace("used","available");
            document.getElementById("audience").classList.replace("used","available");
            // remove audience window if exist
            const audienceWindow = document.getElementById("audience-window");
            if (audienceWindow){
                audienceWindow.remove();
            }
            // reset variables
            answer = -1;
            current_question = -1;
            answer2 = -1;
            removed_answers = [-1,-1];
            x2used = false;
            removed_answers_used = false;
            yield_used = false;
            change_used = false;
        }
        function prepareQuestions(){
            const arr1 = shuffle(questions_easy.slice());
            const arr2 = shuffle(questions_hard.slice());

            for (var i = 0; i < 4; i++){
                questions[i] = arr1[i];
            }
            for (var i = 0; i < 8; i++){
                questions[i + 4] = arr2[i];
            }
            questions[12] = arr1[4];
            questions[13] = arr2[8];
        }
        function shuffle(arr){
            for (var i = arr.length - 1; i > 0; i--){
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i],arr[j]] = [arr[j],arr[i]];
            }
            return arr;
        }
        function showResult(state){
            let money = 0;
            if (state === "yield"){
                if (current_question > 0)
                    money = prizes[current_question-1];
            } else if (state === "lose") {
                if (current_question >= 8 )
                    money = 200;
                else if (current_question >= 4)
                    money = 20;
            } else {
                money = 2000;
            }
            const message = money+"جنيه مصري ";
            requestAnimationFrame(() => {
                requestAnimationFrame(() => alert(message));
            });
        }
        function printQuestion(){
            document.getElementById("question").textContent = questions[current_question].question;
            for(let i=1; i<=4;i++){
                document.getElementsByClassName("answer"+i)[0].classList.replace("selected","not-selected");
                document.getElementsByClassName("answer"+i)[0].classList.replace("correct","not-selected");
                document.getElementsByClassName("answer"+i)[0].classList.replace("wrong","not-selected");
                document.getElementById("text"+i).textContent = questions[current_question].answers[i-1];
            }
        }
    </script>
</body>
